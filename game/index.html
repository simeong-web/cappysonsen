<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Mobile-first. viewport-fit=cover lets the water reach the screen edges;
     the safe-area insets below keep the UI off the notch and home bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3f8e9b">
<meta name="description" content="Cappy's Onsen — a roguelike match-3. Soak, match, draft charms.">
<title>Cappy's Onsen</title>
<!-- Inline, so the bundle stays self-contained and never 404s a favicon. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='27' font-size='27'>%F0%9F%8D%8A</text></svg>">
<style>
  :root{
    /* Read back by main.ts. env() is only usable from CSS, so it is parked on
       custom properties the renderer can read via getComputedStyle. */
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#3f8e9b}
  body{
    font:16px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;color:#fffbea;
    /* No pull-to-refresh or double-tap zoom fighting the board. */
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  #boot{
    position:fixed;inset:0;display:grid;place-items:center;text-align:center;
    padding:24px;color:#8aa3ad;font-size:14px;letter-spacing:2px;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">CAPPY'S ONSEN — warming up…</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
