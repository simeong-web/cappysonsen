name: Gitleaks

# Weekly, not on every PR - keeps PR CI fast/cheap (a live cost concern already
# tracked on this board), findings get triaged into board tasks whenever the weekly
# run surfaces something. workflow_dispatch so it can be run on demand to verify it
# actually works, rather than waiting up to a week for the first real signal.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
